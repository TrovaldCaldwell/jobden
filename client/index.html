<!DOCTYPE html>
<html lang="sw" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>JOBDENI — Universal Money Kiosk</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="bg-container"></div>
    <div id="kiosk-frame">
        <header id="kiosk-header"></header>
        <main id="kiosk-screen">
            <section id="screen-attract"></section>
            <section id="screen-language"></section>
            <section id="screen-phone"></section>
            <section id="screen-services"></section>
            <section id="screen-withdraw"></section>
            <section id="screen-send"></section>
            <section id="screen-banking"></section>
            <section id="screen-deposit"></section>
            <section id="screen-airtime"></section>
        </main>
        <footer id="kiosk-footer"></footer>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
